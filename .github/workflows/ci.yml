name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo, pdo_sqlite
          ini-values: post_max_size=256M, upload_max_filesize=256M

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Get composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php -r "file_exists('database/database.sqlite') || mkdir('database'); touch('database/database.sqlite');"
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: vendor/bin/phpunit --colors=always --stop-on-failure

      - name: Run accounting feature tests (targeted)
        # Run only the accounting feature tests to give faster feedback for accounting PRs
        run: php artisan test --filter AccountingFeatureTest --stop-on-failure
